name: Build and deploy
on:
  push:
    branches:
      - main
      - test
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and test
        run: |
          npm run lint
          npm test

      - name: Build (version is today's date, YY.M.D)
        run: |
          export APP_VERSION="$(date +'%y').$(date +'%-m').$(date +'%-d')"
          echo "Building version ${APP_VERSION}"
          npm run build

      - name: Deploy main to the site root
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          # Keep the test preview that lives in /test.
          clean-exclude: test

      - name: Deploy test to /test
        if: github.ref == 'refs/heads/test'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          target-folder: test
          clean: true
